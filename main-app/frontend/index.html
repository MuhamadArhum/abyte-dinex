<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Abyte ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyte ERP</title>
    <!-- Inter font — professional business app typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;background:#f9fafb;">
    <div id="root">
      <div id="pre-load" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f9fafb;">
        <img src="/logo.png" alt="AByte" style="width:56px;height:56px;object-fit:contain;animation:pulse 1.5s ease-in-out infinite;" />
        <div style="display:flex;gap:6px;">
          <span style="width:8px;height:8px;border-radius:50%;background:#10b981;animation:bounce 0.8s ease-in-out infinite;animation-delay:0ms;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#10b981;animation:bounce 0.8s ease-in-out infinite;animation-delay:150ms;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#10b981;animation:bounce 0.8s ease-in-out infinite;animation-delay:300ms;"></span>
        </div>
        <style>
          @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
          @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

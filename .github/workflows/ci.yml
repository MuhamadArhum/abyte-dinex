name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-app/backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_for_ci_at_least_32_characters_long
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: test_db

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
